<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Facility Maintenance Request Management System — DBMS Review 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#090D16;--sf:#0F172A;--card:rgba(18,26,47,.75);--bd:rgba(99,102,241,.22);--pr:#6366F1;--se:#06B6D4;--ac:#F43F5E;--em:#10B981;--am:#F59E0B;--tx:#F8FAFC;--t2:#94A3B8;--t3:#64748B}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html,body{height:100%}body{background:var(--bg);color:var(--tx);overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:.4;pointer-events:none}.o1{top:-10%;left:-5%;width:480px;height:480px;background:#4f46e5}.o2{bottom:-15%;right:-5%;width:560px;height:560px;background:#06b6d4}
.top{position:fixed;top:14px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;z-index:50;pointer-events:none;font-size:12px}
.badge{background:rgba(99,102,241,.15);border:1px solid var(--bd);color:#c7d2fe;padding:5px 12px;border-radius:99px;font-weight:600}.cnt{color:var(--t2);font-family:'JetBrains Mono',monospace}
.slide{position:absolute;inset:0;padding:60px 40px 84px;overflow:auto;opacity:0;visibility:hidden;transform:translateX(30px);transition:.45s;z-index:1}
.slide.on{opacity:1;visibility:visible;transform:none}.in{max-width:1100px;margin:0 auto}
h1{font-size:clamp(28px,5vw,52px);line-height:1.1;font-weight:800;background:linear-gradient(90deg,#fff,#a5b4fc,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(22px,3vw,32px);font-weight:800}.sub{color:var(--t2);margin:4px 0 18px}h3{font-size:15px;margin-bottom:8px}
.title{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;min-height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{border:1px solid var(--bd);background:var(--card);color:#c7d2fe;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;backdrop-filter:blur(8px)}
.card:hover{border-color:rgba(99,102,241,.6)}.card p,.card li{font-size:13.5px;color:var(--t2);line-height:1.55}.card ul{padding-left:18px}.card b{color:var(--tx)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--se);margin-bottom:6px}.bad{color:var(--ac)}.good{color:var(--em)}
.ent{cursor:pointer;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:13px;font-weight:700}.ent.on{border-color:var(--se);box-shadow:0 0 18px rgba(6,182,212,.35)}.ent small{display:block;color:var(--t3);font-weight:500;font-size:11px}
.ex{display:grid;grid-template-columns:1fr 330px;gap:14px}@media(max-width:860px){.ex{grid-template-columns:1fr}}
.pk{color:var(--am);font-weight:700;font-family:'JetBrains Mono',monospace}.fk{color:var(--se);font-family:'JetBrains Mono',monospace}.at{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--t2)}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}th{color:var(--se);font-size:11px;text-transform:uppercase}.tw{overflow-x:auto}
svg text{font-family:'Plus Jakarta Sans',sans-serif}
.dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(15,23,42,.85);border:1px solid var(--bd);border-radius:99px;padding:6px 10px;z-index:60;backdrop-filter:blur(10px)}
.dock button{background:none;border:0;color:var(--t2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-weight:700;font-size:13px}.dock button.on{background:var(--pr);color:#fff}.dock button:hover{color:#fff}
.pitch{position:fixed;right:20px;bottom:76px;width:min(420px,calc(100vw - 40px));background:rgba(9,13,22,.96);border:1px solid var(--se);border-radius:16px;padding:16px;z-index:70;display:none;max-height:50vh;overflow:auto}.pitch.on{display:block}.pitch p{font-size:14px;line-height:1.6;color:#e2e8f0;font-style:italic}.pitch h3{color:var(--se)}
</style></head><body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="top"><span class="badge">DBMS Project 41 · Review 1</span><span class="cnt" id="cnt"></span></div>
<main id="deck"></main>
<div class="dock" id="dock"></div>
<div class="pitch" id="pitch"><h3 id="ph"></h3><p id="pt"></p></div>
<script>
// ----- data -----
const G=["Places & People","Request Core","Work & Materials","Audit & Feedback"];
const E=[["Building",0,"*building_id,name","Campus building that houses rooms","building"],["Room",0,"*room_id,^building_id,room_no","Room or hall inside a building","room"],["Asset",0,"*asset_id,^room_id,name","Fixed item such as a fan, projector or tap","asset"],["User",0,"*user_id,name,email,role","Person who raises requests (Student, Staff, Admin)","app_user"],["Technician",0,"*tech_id,name,phone,^category_id","Maintenance staff with a main skill area","technician"],["Category",1,"*category_id,name","Fault type: Electrical, Plumbing, Furniture, Classroom AV","category"],["Priority",1,"*priority_id,name,sla_hours","Urgency level and target response time","priority"],["Request",1,"*request_id,request_no,^user_id,^room_id,^asset_id,^category_id,^priority_id,description,status,created_at,closed_at,closure_remarks","The complaint itself: the hub of the system","request"],["Assignment",1,"*assign_id,^request_id,^tech_id,assigned_at","Allocation of a request to a technician (can be reassigned)","assignment"],["Work Log",2,"*log_id,^assign_id,note,hours,logged_at","Work done during an assignment","work_log"],["Material",2,"*material_id,name,unit_cost","Spare parts and consumables","material"],["Material Use",2,"*use_id,^log_id,^material_id,qty","Associative entity: resolves Work Log M:N Material","material_use"],["Status History",3,"*hist_id,^request_id,old_status,new_status,changed_at","Audit trail of every status change","status_history"],["Feedback",3,"*^request_id,rating,comments","Requester rating after closure (1 to 5)","feedback"]];
const R=[["Building","Room","has","1","N"],["Room","Asset","contains","1","N"],["Room","Request","located in","1","N"],["Asset","Request","concerns","1","N"],["User","Request","raises","1","N"],["Category","Request","classified as","1","N"],["Priority","Request","urgency","1","N"],["Request","Status History","tracked by","1","N"],["Request","Feedback","rated by","1","0..1"],["Request","Assignment","allocated","1","N"],["Technician","Assignment","performs","1","N"],["Category","Technician","skilled in","1","N"],["Assignment","Work Log","records","1","N"],["Work Log","Material Use","consumes","1","N"],["Material","Material Use","used in","1","N"]];
const P={Building:[110,60],Room:[430,60],Asset:[750,60],User:[110,260],Priority:[110,400],Category:[110,560],Request:[430,260],Feedback:[430,420],"Status History":[750,400],Assignment:[750,560],Technician:[430,560],"Work Log":[980,560],"Material Use":[980,400],Material:[980,240]};
const attrs=e=>e[2].split(',').map(a=>({k:a[0]=='*'?'PK':a[0]=='^'?'FK':'',n:a.replace(/[*^]/g,'')}));
const T=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const L=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
// ----- slides -----
const S=[];
S.push(()=>`<div class="title"><span class="badge">Database Management Systems · Review 1</span><h1>Campus Facility Maintenance<br>Request Management System</h1><p class="sub" style="margin:0">Controlled, Auditable Complaint-to-Closure Relational Database</p><div class="chips"><span class="chip">3NF Normalized</span><span class="chip">14 Entities</span><span class="chip">Status &amp; Assignment Control</span><span class="chip">MySQL 8.0 DDL Ready</span></div><p class="sub" style="margin:0;font-size:13px">Sushil Pal · 25WU0101141 · CSE Panthers Core · Faculty: Mrs. Sahithi Mam</p><p class="sub" style="margin:0;font-size:12px">Navigate with ← → or the bottom dock • Press P for Pitch</p></div>`);
S.push(()=>`<div class="in"><h2>1. Objectives &amp; Target Users</h2><p class="sub">Functional boundaries and actor modelling</p><div class="g"><div class="card"><div class="tag">Primary objectives</div>${L(["Conceptual ER modelling: 14 entities, one M:N resolved by Material Use","3NF normalization: no transitive dependency","Business rules in the database: keys, UNIQUE, CHECK, DEFAULT, triggers","Joins, aggregates, views and management reports","Java front-end for the full request life cycle"])}</div>${[["Requester (Student / Staff)","Logs a request, tracks status, gives feedback after closure"],["Facility Administrator","Sets priority, assigns technicians, monitors pending and ageing work, closes requests"],["Technician","Views jobs, updates status, records work and materials used"],["Management","Reads response time, technician load, building cost, material use, feedback"]].map(u=>`<div class="card"><div class="tag">Actor</div><h3>${u[0]}</h3><p>${u[1]}</p></div>`).join('')}</div></div>`);
S.push(()=>`<div class="in"><h2>2. Problem Identification &amp; Scope</h2><p class="sub">Replacing paper registers with a controlled relational database</p><div class="g">${[["Lost or duplicate requests","Unique request numbers (UNIQUE) and a single request table"],["Informal assignment","Assignment table plus a rule: Open requests only, maximum 3 active jobs per technician"],["No record of work and cost","Work Log and Material Use record hours, materials and unit cost"],["No visibility or reporting","Status history, ageing, response time and feedback computed by views"]].map(p=>`<div class="card"><div class="tag bad">Problem</div><p><b>${p[0]}</b></p><div class="tag good" style="margin-top:8px">Solution</div><p>${p[1]}</p></div>`).join('')}<div class="card"><div class="tag">In scope</div><p>Requests against buildings, rooms and assets; priority; technician assignment; work logs and materials; status tracking; closure details; feedback; management reports.</p></div><div class="card"><div class="tag">Out of scope</div><p>Technician payroll and attendance, procurement and stock purchasing, online payments, ERP integration.</p></div></div></div>`);
S.push(()=>`<div class="in"><h2>3. Interactive Conceptual ER Explorer</h2><p class="sub">Click any entity to inspect its attributes, keys and relationships</p><div class="chips" id="fl" style="justify-content:flex-start;margin-bottom:12px"></div><div class="ex"><div class="g" id="eg" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-content:start"></div><div class="card" id="ed"></div></div><p class="sub" style="font-size:12px;margin-top:10px">Tip: PK = primary key, FK = foreign key. Material Use is the associative entity.</p></div>`);
S.push(()=>`<div class="in"><h2>4. Conceptual E-R Diagram (Chen's Model)</h2><p class="sub">Entities, associative entity, relationships and cardinalities</p><div class="card" style="padding:8px"><div id="chen"></div></div><div class="chips" style="margin-top:10px"><span class="chip">▭ Entity</span><span class="chip">▭▭ Associative entity</span><span class="chip">◇ Relationship</span><span class="chip">1 / N / 0..1 Cardinality</span></div></div>`);
S.push(()=>`<div class="in"><h2>5. Initial Relational Schema &amp; 3NF Verification</h2><p class="sub">Normalized tables, primary keys and foreign key constraints</p><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${E.map(e=>`<div class="card" style="padding:12px"><div class="tag">${e[4]}</div><div class="at">${attrs(e).map(a=>a.k=='PK'?`<div class="pk">${a.n} <small>PK</small></div>`:a.k=='FK'?`<div class="fk">${a.n} <small>FK</small></div>`:`<div>${a.n}</div>`).join('')}</div></div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="tag">3NF verification</div>${L(["1NF: work notes, materials and status changes are separate rows, not repeating groups","2NF: material name and cost depend only on material_id, so they live in Material","3NF: building name via Room, SLA hours via Priority, skill via Technician, email and role via User","BCNF holds: the only other determinants (name, email, request_no) are unique keys"])}</div></div>`);
S.push(()=>`<div class="in"><h2>6. Sample Live Data &amp; Verification</h2><p class="sub">Proof that the model holds realistic data and the rules</p><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))"><div class="card"><div class="tag">Sample requests</div>${T(["Request","Room","Category","Priority","Status"],[["REQ-0001","Main Block 101","Electrical","High","Closed"],["REQ-0002","Science Lab-1","Classroom AV","Medium","Closed"],["REQ-0005","Science 204","Electrical","Critical","In Progress"],["REQ-0007","Library Reading Hall","Electrical","High","Assigned"],["REQ-0009","Sports Gym","Furniture","Low","Open"]])}</div><div class="card"><div class="tag">Assignments and work</div>${T(["Request","Technician","Work","Hours"],[["REQ-0001","Ramesh","Replaced capacitor","1.5"],["REQ-0002","Imran","Replaced projector lamp","2.0"],["REQ-0003","Suresh","Replaced tap washer","1.0"],["REQ-0005","Ramesh","Replaced socket","2.0"]])}</div><div class="card"><div class="tag">Status history of REQ-0001</div>${T(["Old","New"],[["-","Open"],["Open","Assigned"],["Assigned","In Progress"],["In Progress","Closed"]])}</div><div class="card"><div class="tag">Rule checks</div>${L(["✔ Request numbers are unique","✔ Closed request has closure date and remarks","✔ Status moves only Open → Assigned → In Progress → Closed","✔ A technician holds at most 3 active jobs","✔ Feedback only after closure"])}</div></div></div>`);
S.push(()=>`<div class="in"><h2>7. Review 1 Conclusion &amp; Review 2 Roadmap</h2><p class="sub">Ready for DDL execution, constraints and SQL</p><div class="g"><div class="card"><div class="tag good">Review 1 completed</div>${L(["✔ Problem, scope, objectives and users","✔ Conceptual ER model: 14 entities, 15 relationships","✔ Initial relational schema in 3NF","✔ MySQL DDL script (review1_schema.sql)"])}</div><div class="card"><div class="tag">Review 2 next</div>${L(["Functional dependencies and data dictionary","DDL with CHECK, UNIQUE, NOT NULL and DEFAULT","Triggers: status flow, assignment control, feedback rule","Sample data, joins, subqueries, views","Indexes and prototype demonstration"])}</div><div class="card"><div class="tag">Review 3 later</div>${L(["Java JDBC application: CRUD, search, validation, reports","Final report, demo video and viva"])}</div></div></div>`);
const PITCH=["Good morning everyone. I am presenting the conceptual design of our Campus Facility Maintenance Request Management System for Review 1. It replaces paper complaint registers with a controlled database.","Our objective is a normalized relational database with business rules and a Java front-end. The main users are requesters, the facility administrator, technicians and management.","The problems today are lost requests, informal assignment, no record of work and cost, and no reporting. Each one maps to a database feature, shown on the right of each card.","This explorer lets us inspect any of the 14 entities. The Request is the hub. Material Use is the associative entity that resolves the many-to-many link between work and materials.","This is the Chen-style ER diagram. Every relationship is one-to-many, except Request to Feedback, which is one to at most one. Cardinalities are marked on each line.","The relational schema has 14 tables with primary and foreign keys. It is in third normal form: nothing depends on a non-key column, and derived values like cost are not stored.","Sample data shows requests in different states, assignments, work and history. The rule checks confirm unique numbers, closure details, ordered status changes and the 3-job limit.","In summary, Review 1 delivers the full conceptual and relational model and the DDL. Review 2 adds constraints, triggers, sample data and queries; Review 3 adds the Java application. Thank you."];
// ----- engine -----
let cur=0,fl=-1,se=7;
const deck=document.getElementById('deck');
S.forEach((f,i)=>{const s=document.createElement('section');s.className='slide'+(i?'':' on');s.id='s'+i;s.innerHTML=f();deck.appendChild(s)});
const dock=document.getElementById('dock');
dock.innerHTML='<button id="pv">‹</button>'+S.map((_,i)=>`<button data-i="${i}">${i+1}</button>`).join('')+'<button id="nx">›</button><button id="pb" title="Pitch (P)">P</button>';
function go(i){cur=Math.max(0,Math.min(S.length-1,i));document.querySelectorAll('.slide').forEach((s,k)=>s.classList.toggle('on',k==cur));dock.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i==cur));document.getElementById('cnt').textContent=(cur+1)+' / '+S.length;document.getElementById('ph').textContent='Presenter Pitch — Slide '+(cur+1);document.getElementById('pt').textContent='“'+PITCH[cur]+'”'}
dock.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='pv')go(cur-1);else if(b.id=='nx')go(cur+1);else if(b.id=='pb')document.getElementById('pitch').classList.toggle('on');else go(+b.dataset.i)};
document.onkeydown=e=>{if(e.key=='ArrowRight'||e.key==' ')go(cur+1);else if(e.key=='ArrowLeft')go(cur-1);else if(e.key=='p'||e.key=='P')document.getElementById('pitch').classList.toggle('on')};
// explorer
function exp(){const eg=document.getElementById('eg');document.getElementById('fl').innerHTML=['All (14)',...G].map((g,i)=>`<span class="chip ${fl==i-1?'on':''}" data-f="${i-1}">${g}</span>`).join('');
eg.innerHTML=E.map((e,i)=>({e,i})).filter(o=>fl<0||o.e[1]==fl).map(o=>`<div class="ent ${o.i==se?'on':''}" data-e="${o.i}">${o.e[0]}<small>${G[o.e[1]]}</small></div>`).join('');
const e=E[se],rl=R.filter(r=>r[0]==e[0]||r[1]==e[0]);
document.getElementById('ed').innerHTML=`<div class="tag">${e[1]==2&&e[0]=='Material Use'?'Associative entity':'Entity'} · table ${e[4]}</div><h3 style="font-size:18px">${e[0]}</h3><p>${e[3]}</p><div class="at" style="margin:10px 0">${attrs(e).map(a=>a.k=='PK'?`<div class="pk">${a.n} · PK</div>`:a.k=='FK'?`<div class="fk">${a.n} · FK</div>`:`<div>${a.n}</div>`).join('')}</div><div class="tag">Relationships</div><ul style="padding-left:18px;font-size:13px;color:var(--t2)">${rl.map(r=>`<li>${r[0]} ${r[3]} — <i>${r[2]}</i> — ${r[4]} ${r[1]}</li>`).join('')}</ul>`}
document.getElementById('s3').onclick=e=>{const f=e.target.closest('[data-f]'),n=e.target.closest('[data-e]');if(f){fl=+f.dataset.f;exp()}if(n){se=+n.dataset.e;exp()}};exp();
// Chen diagram
(function(){const W=64,H=20,ln=[],dm=[],bx=[],cd=[];
R.forEach(r=>{const a=P[r[0]],b=P[r[1]],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
ln.push(`<path d="M${a[0]} ${a[1]}L${m[0]} ${m[1]}L${b[0]} ${b[1]}" stroke="#64748B" stroke-width="1.3" fill="none"/>`);
dm.push(`<polygon points="${m[0]},${m[1]-15} ${m[0]+22},${m[1]} ${m[0]},${m[1]+15} ${m[0]-22},${m[1]}" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/><text x="${m[0]+26}" y="${m[1]+4}" font-size="11" fill="#F59E0B" stroke="#090D16" stroke-width="4" paint-order="stroke">${r[2]}</text>`);
[[a,b,r[3]],[b,a,r[4]]].forEach(([p,q,t])=>{const dx=(q[0]+p[0])/2-p[0],dy=(q[1]+p[1])/2-p[1],s=Math.min(W/Math.abs(dx||1e-9),H/Math.abs(dy||1e-9)),d=Math.hypot(dx,dy),u=[dx/d,dy/d],x=p[0]+dx*s+u[0]*16-u[1]*10,y=p[1]+dy*s+u[1]*16+u[0]*10;
cd.push(`<text x="${x}" y="${y+4}" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle" stroke="#090D16" stroke-width="3" paint-order="stroke">${t}</text>`)})});
E.forEach(e=>{const p=P[e[0]],as=e[0]=='Material Use';bx.push(`<rect x="${p[0]-W}" y="${p[1]-H}" width="${2*W}" height="${2*H}" rx="6" fill="#0F172A" stroke="${e[0]=='Request'?'#06B6D4':'#6366F1'}" stroke-width="${e[0]=='Request'?2.5:1.8}"/>${as?`<rect x="${p[0]-W+5}" y="${p[1]-H+5}" width="${2*W-10}" height="${2*H-10}" rx="4" fill="none" stroke="#6366F1"/>`:''}<text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="13" font-weight="700" fill="#F8FAFC">${e[0]}</text>`)});
document.getElementById('chen').innerHTML=`<svg viewBox="0 0 1100 620" style="width:100%;height:auto;display:block" role="img" aria-label="Chen ER diagram with 14 entities and 15 relationships">${ln.join('')}${dm.join('')}${bx.join('')}${cd.join('')}</svg>`})();
go(0);
</script></body></html>
